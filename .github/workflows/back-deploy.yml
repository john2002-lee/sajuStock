# back/ 을 Cloud Run 에 빌드·배포한다. main 에 push 하면 자동으로 돈다.
#
# 이 파일은 `back/deploy/deploy.ps1` 의 배포 절차를 옮긴 것이다. 그 스크립트를
# 지우지 않은 이유: 비밀 **값** 을 `.env` 에서 Secret Manager 로 올리는 일은 CI 가
# 대신할 수 없다(값이 로컬에만 있다). 역할이 이렇게 갈린다.
#
#   deploy.ps1     (로컬·수동) — 비밀 값 갱신, API 활성화, 런타임 SA 권한
#   setup-cicd.ps1 (로컬·1회) — 이 워크플로가 GCP 에 붙을 수 있게 하는 WIF 부트스트랩
#   이 파일        (자동)     — 검사 → 빌드 → 마이그레이션 → 배포 → 스모크
#
# **GitHub 시크릿을 쓰지 않는다.** 아래 env 의 두 값(프로바이더 리소스명, SA 이메일)은
# 비밀이 아니다 — 그것만으로는 아무것도 못 하고, GitHub 이 서명한 OIDC 토큰의 주체가
# `repo:john2002-lee/sajuStock:ref:refs/heads/main` 과 일치해야 교환이 된다.
# 저장소가 공개라 장기 자격증명(SA JSON 키)을 두지 않는 것이 특히 중요했다.

name: back deploy

on:
  push:
    branches: [main]
    # front/ 나 docs 만 바뀐 커밋으로 5~8분짜리 이미지 빌드를 돌리지 않는다.
    paths:
      - 'back/**'
      - '.github/workflows/back-deploy.yml'
  workflow_dispatch:

# **의도적으로 cancel-in-progress 를 끈다.**
#
# 켜면 연속 push 때 앞 실행이 취소되는데, 그 취소가 마이그레이션 단계에 걸리면
# `--wait` 만 끊기고 Cloud Run Job 은 계속 돈다 — 곧바로 시작하는 다음 실행이 두
# 번째 `alembic upgrade head` 를 띄워 두 개가 겹친다.
#
# 끄면 큐에 들어가 순서대로 돈다. GitHub 은 대기 중인 실행을 하나만 남기므로
# (새 것이 오면 앞의 **대기 중** 실행을 취소한다) 마지막에 배포되는 것은 항상
# 최신 커밋이다. 오래된 리비전이 잠깐 더 사는 대신 마이그레이션이 겹치지 않는다.
concurrency:
  group: back-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # WIF 의 OIDC 토큰 발급에 필수다. 빠지면 auth 스텝이 "unable to get ACTIONS_ID_TOKEN"
  # 으로 죽는데, 메시지가 GCP 쪽처럼 보여서 IAM 을 한참 뒤지게 된다.
  id-token: write

env:
  GCP_PROJECT: project-b6d7001f-3a61-4b53-a5d
  GCP_REGION: asia-northeast1
  SERVICE: sajustock-back
  MIGRATE_JOB: sajustock-back-migrate
  AR_REPO: cloud-run-source-deploy
  # setup-cicd.ps1 이 만든 것과 일치해야 한다 (그 스크립트가 마지막에 출력한다).
  WIF_PROVIDER: projects/997442788415/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOY_SA: github-deployer@project-b6d7001f-3a61-4b53-a5d.iam.gserviceaccount.com

jobs:
  # GCP 자격증명이 **없는** 잡이다. 검사만 하므로 클라우드에 닿을 이유가 없고,
  # 닿지 않으면 여기서 새어 나갈 것도 없다.
  gate:
    name: ruff + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7

      # setup-uv 는 major 이동 태그(`v10` 같은 것)를 발행하지 않는다 — 정확한
      # 릴리스 태그로 고정한다. `version` 은 Dockerfile 이 쓰는 uv 와 같은 핀이다.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: back/uv.lock

      # 락파일 그대로 설치한다. 락과 pyproject 가 어긋나면 여기서 멈춘다 —
      # "CI 에서만 다른 버전이 깔려 통과했다" 를 만들지 않는다.
      - run: uv sync --frozen

      - run: uv run ruff check .

      # `SKIP_DB_TESTS` 는 Postgres 를 요구하는 183개를 건너뛰고 364개를 돌린다
      # (판정 기준과 이 플래그가 필요한 이유는 `back/tests/conftest.py` 의
      # `pytest_collection_modifyitems` 주석에 있다).
      #
      # DB 테스트까지 돌리려면 `DATABASE_URL` 과 **다른** Supabase 프로젝트의 주소를
      # 시크릿으로 넣어야 한다 — 그 하네스는 `drop_all` 로 시작한다.
      - run: uv run pytest -q
        env:
          SKIP_DB_TESTS: "1"

  deploy:
    name: build + migrate + deploy
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # --- 비밀 바인딩 결정 -------------------------------------------------
      # 목록은 `back/deploy/secret-keys.txt` 하나다 (deploy.ps1 도 같은 파일을 읽는다).
      #
      # 선언됐지만 Secret Manager 에 없는 키를 **하드 실패로 두지 않는다** — 키 하나
      # 때문에 배포 전체가 죽는다. 대신 경고로 남긴다. 조용히 넘기지도 않는다:
      # 실제로 AMPLITUDE_AI_API_KEY 가 `.env` 에만 있고 Secret Manager 에 없어서
      # 운영 백엔드만 Amplitude 없이 돌고 있었고, 아무 신호도 없었다.
      #
      # 배포 SA 에는 `secretmanager.viewer` 만 있다 — 이름은 보이지만 **값은 못 읽는다**.
      - id: secrets
        name: 비밀 바인딩 결정
        run: |
          # `#` 뒤 주석과 공백을 털고 빈 줄을 버린다 (Get-SecretKeys 와 같은 규칙).
          mapfile -t declared < <(sed 's/#.*//' deploy/secret-keys.txt | tr -d ' \t\r' | grep -v '^$')
          mapfile -t present < <(gcloud secrets list --project "$GCP_PROJECT" --format='value(name.basename())')

          echo "선언: ${#declared[@]}개 / Secret Manager: ${#present[@]}개"

          bindings=()
          missing=()
          for key in "${declared[@]}"; do
            if printf '%s\n' "${present[@]}" | grep -qxF "$key"; then
              bindings+=("${key}=${key}:latest")
            else
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            for key in "${missing[@]}"; do
              echo "::warning title=시크릿 누락::secret-keys.txt 의 $key 가 Secret Manager 에 없어 바인딩하지 않았다. 값을 올리려면 로컬에서 back/deploy/deploy.ps1 을 한 번 돌려야 한다 (CI 는 .env 를 볼 수 없다)."
            done
          fi

          # DATABASE_URL 이 없으면 마이그레이션 잡이 붙을 DB 가 없다 — 빌드 5분을
          # 태우고 나서 죽는 대신 여기서 멈춘다.
          if ! printf '%s\n' "${bindings[@]}" | grep -q '^DATABASE_URL='; then
            echo "::error title=DATABASE_URL 없음::Secret Manager 에 DATABASE_URL 이 없다. 로컬에서 back/deploy/deploy.ps1 을 먼저 돌려라."
            exit 1
          fi

          joined=$(IFS=,; echo "${bindings[*]}")
          echo "bindings=$joined" >> "$GITHUB_OUTPUT"
          echo "missing_count=${#missing[@]}" >> "$GITHUB_OUTPUT"
          echo "바인딩: $joined"

      # --- 이미지 태그 ------------------------------------------------------
      # 타임스탬프가 아니라 커밋 SHA 를 쓴다. 리비전 이름만 보고 "지금 도는 것이 어느
      # 커밋인지" 를 알 수 있어야 롤백 지점을 이름으로 가리킬 수 있다. 실행 번호를
      # 붙이는 것은 같은 커밋을 다시 배포(workflow_dispatch)할 때 태그가 겹치지
      # 않게 하기 위한 것이다.
      - id: meta
        name: 이미지 태그 결정
        run: |
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${SERVICE}:${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$image"

      # --- 빌드 -------------------------------------------------------------
      # `gcloud run deploy --source` 를 쓰지 않는다 — 그쪽은 BuildKit 없이 레거시
      # 빌더로 돌고, 우리 Dockerfile 의 `RUN --mount=type=cache` 가 거기서 즉시
      # 죽는다. 이유는 `back/deploy/cloudbuild.yaml` 머리말에 적혀 있다.
      #
      # 소스 스테이징과 로그 경로를 **명시** 한다. gcloud 가 알아서 고르게 두면
      # 배포 SA 에 권한을 준 버킷과 다른 곳을 쓸 수 있고, 그때 실패는 권한 오류로
      # 나타나 원인이 안 보인다. 이 버킷 하나에만 권한이 있다(setup-cicd.ps1).
      - name: 이미지 빌드 (Cloud Build · BuildKit)
        run: |
          gcloud builds submit . \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --config deploy/cloudbuild.yaml \
            --substitutions "_IMAGE=${{ steps.meta.outputs.image }}" \
            --gcs-source-staging-dir "gs://${GCP_PROJECT}_cloudbuild/source" \
            --gcs-log-dir "gs://${GCP_PROJECT}_cloudbuild/deploy-logs"

      # --- 마이그레이션 -----------------------------------------------------
      # **배포보다 먼저, 그리고 실패하면 배포하지 않는다.** 앱은 스키마를 만들지
      # 않으므로(`DB_CREATE_ALL_ON_STARTUP=false` 가 이미지에 박혀 있다) 새 코드가
      # 없는 컬럼을 읽는 상태로 뜨는 것을 막을 방법이 이 순서뿐이다.
      #
      # 방금 만든 **같은 이미지** 로 돈다 — alembic·alembic.ini 가 이미지에 들어 있다.
      # 별도 러너에서 alembic 을 돌리지 않은 이유: 그러려면 DATABASE_URL 을 GitHub
      # 시크릿으로 복제해야 하고, 그 순간 "비밀은 Secret Manager 에만 있다" 가 깨진다.
      #
      # Settings 의 모든 필드에 기본값이 있어 DATABASE_URL 하나만 넣으면 된다.
      - name: DB 마이그레이션 (alembic upgrade head)
        run: |
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --image "${{ steps.meta.outputs.image }}" \
            --command alembic \
            --args upgrade,head \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --memory 1Gi --cpu 1 \
            --max-retries 0 \
            --task-timeout 600s \
            --execute-now --wait \
            --quiet

      # --- 배포 -------------------------------------------------------------
      # 플래그는 deploy.ps1 과 같은 값이다. 각각의 근거는 그 파일 주석에 있고,
      # 여기서 요약하면:
      #   --port 8000            Dockerfile 의 CMD 가 8000 고정 (Cloud Run 기본은 8080)
      #   --memory 2Gi --cpu 2   pandas·numpy·langgraph 가 같이 올라온다
      #   --no-cpu-throttling    시총·스냅샷 배치는 응답을 보낸 뒤 도는 백그라운드 작업
      #   --min-instances 1        이라, 기본 설정에선 응답 직후 얼어붙는다
      #   --max-instances 3      캐시가 프로세스 로컬 — 인스턴스 수만큼 LLM 비용이 곱해진다
      #   --timeout 300          SSE(/advice/stream): 판단 예산 90초 + 하트비트
      #   --env-vars-file        CORS_ORIGINS 가 JSON 배열이라 인라인으로는 콤마에서 쪼개진다
      #
      # env.yaml 이 이 워크플로의 입력이므로, 프런트 오리진을 CORS_ORIGINS 에
      # 추가하는 일이 이제 **push 하나** 로 끝난다.
      - id: deploy
        name: Cloud Run 배포
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --image "${{ steps.meta.outputs.image }}" \
            --port 8000 \
            --memory 2Gi --cpu 2 \
            --no-cpu-throttling \
            --min-instances 1 --max-instances 3 \
            --timeout 300 --concurrency 40 \
            --env-vars-file deploy/env.yaml \
            --set-secrets "${{ steps.secrets.outputs.bindings }}" \
            --allow-unauthenticated \
            --quiet

          url=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # --- 확인 -------------------------------------------------------------
      # `run deploy` 가 0 을 냈다는 것은 리비전이 준비됐다는 뜻이지, 앱이 답한다는
      # 뜻은 아니다. 여기까지 초록이어야 "배포됐다" 고 말할 수 있다.
      - name: 헬스체크
        run: |
          url="${{ steps.deploy.outputs.url }}/health"
          for attempt in $(seq 1 10); do
            # `|| echo 000` 이 아니라 `|| code=000` 이다. curl 은 실패해도 `-w` 를
            # 먼저 찍기 때문에, 파이프 안에서 이어 붙이면 code 가 "000000" 처럼
            # 두 줄이 되어 비교가 영원히 어긋난다.
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 20 "$url") || code=000
            if [ "$code" = "200" ]; then
              echo "200 OK (${attempt}번째 시도)"
              cat /tmp/health.json
              exit 0
            fi
            echo "  ${attempt}/10 — HTTP $code, 5초 후 재시도"
            sleep 5
          done
          echo "::error title=헬스체크 실패::$url 이 200 을 내지 않았다 (마지막 HTTP $code)"
          cat /tmp/health.json || true
          exit 1

      - name: 요약
        if: always()
        run: |
          {
            echo "### back 배포"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 이미지 | \`${{ steps.meta.outputs.image }}\` |"
            echo "| 커밋 | \`${GITHUB_SHA::7}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| 미바인딩 시크릿 | ${{ steps.secrets.outputs.missing_count }}개 |"
          } >> "$GITHUB_STEP_SUMMARY"
