# Cloud Build 로 이미지를 만든다. **`gcloud run deploy --source` 를 쓰지 않는 이유가 있다.**
#
# `--source` 는 빌드 스텝을 자기가 만들고, 그 스텝은 BuildKit 없이 레거시 빌더로 돈다.
# 우리 Dockerfile 은 `RUN --mount=type=cache` 를 쓰므로 거기서 즉시 죽는다:
#
#   Step 6/20 : RUN --mount=type=cache,target=/root/.cache/uv uv sync --frozen ...
#   the --mount option requires BuildKit.
#
# 선택지는 둘이었다 — Dockerfile 에서 캐시 마운트를 걷어내거나, 빌더에 BuildKit 을
# 켜거나. 후자를 택했다. 캐시 마운트는 로컬 `docker compose build` 에서 실제로 값을
# 하고(로컬 Docker 는 BuildKit 이 기본이다), 배포 경로 하나를 맞추려고 개발 경로의
# 최적화를 버릴 이유가 없다.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    # 이 한 줄이 전부다. 레거시 빌더 대신 BuildKit 으로 돈다.
    env:
      - DOCKER_BUILDKIT=1
    # BuildKit 은 기본이 접히는 TTY 출력이라 실패했을 때 로그에 아무것도 안 남는다.
    # `--progress=plain` 이 없으면 다음 사고에서 또 원인을 못 본다.
    args:
      - build
      - --progress=plain
      - --tag=$_IMAGE
      - .

images:
  - $_IMAGE

# `uv sync` 가 의존성 전부를 받는다. 기본 10분은 첫 빌드에 빠듯하다.
timeout: 1800s

options:
  machineType: E2_HIGHCPU_8
