# Cloud Run 비밀 아닌 환경변수. 비밀은 Secret Manager 로 간다 (deploy.ps1).
#
# gcloud 는 모든 값을 문자열로 요구한다 — 숫자도 따옴표를 씌운다.
# `--set-env-vars` 대신 이 파일을 쓰는 이유는 CORS_ORIGINS 의 JSON 배열이다:
# gcloud 는 콤마로 변수를 쪼개므로 인라인으로 넘기면 `["a"` 와 `"b"]` 로 갈린다.
DEBUG: "false"
LOG_LEVEL: "INFO"

# ⚠ 프런트를 배포하면 그 오리진을 **여기 추가하고 다시 배포**해야 한다.
#   빠뜨리면 브라우저가 응답을 버린다 (서버 로그에는 200 만 남아 원인이 안 보인다).
CORS_ORIGINS: '["http://localhost:3000"]'

DB_ECHO: "false"
# 이미지에도 false 로 박혀 있다. 스키마의 출처는 alembic 하나다.
DB_CREATE_ALL_ON_STARTUP: "false"

HTTP_TIMEOUT_SECONDS: "20"
LISTED_COMPANY_MIN_COUNT: "100"
SUGGESTION_CANDIDATE_LIMIT: "500"

STOCK_FUNDAMENTALS_TTL_SECONDS: "900"
STOCK_FUNDAMENTALS_CACHE_SIZE: "512"

# 이 캐시·세마포어는 **프로세스 로컬**이다. 인스턴스가 늘면 캐시가 갈리고 LLM
# 비용이 인스턴스 수만큼 곱해진다 — deploy.ps1 이 max-instances 를 3 으로 묶는 이유다.
ADVICE_CACHE_TTL_SECONDS: "600"
ADVICE_CACHE_SIZE: "256"
ADVICE_MAX_CONCURRENT: "4"
ADVICE_BUDGET_SECONDS: "90"
ADVICE_HEARTBEAT_SECONDS: "10"

# 기본값(gemini-2.5-flash)과 다르다 — 빠뜨리면 조용히 다른 모델로 돈다.
# 2026-09-21: `gemini-3-flash-preview` 에서 내렸다. 그 모델은 한 단어 응답에도
# 44초가 걸려(실측) 아래 45초 상한에 걸렸고, 사주 리포트가 매번 504
# DEADLINE_EXCEEDED → `source="fallback"` 간이 리포트로 떨어졌다.
# 같은 계정에서 2.5-flash 는 같은 프롬프트를 22초에 끝낸다.
GEMINI_MODEL: "gemini-2.5-flash"
LLM_MAX_TOKENS: "16000"
LLM_EFFORT: "medium"
LLM_TIMEOUT_SECONDS: "45"
LLM_MAX_RETRIES: "0"
# 위와 다르다 — 빨리 실패한 호출(503·429 등)만 다시 부른다. 타임아웃은 이미
# 상한을 다 쓴 실패라 재시도하지 않는다 (`app/domain/llm_retry.py`).
LLM_TRANSIENT_RETRIES: "1"

# VECTOR_DATABASE_URL 은 넣지 않는다 — 비어 있으면 DATABASE_URL 을 벡터 저장소로
# 그대로 쓴다. 두 곳에 같은 주소를 적으면 한쪽만 바꿔 어긋난다.
EMBEDDING_MODEL: "gemini-embedding-001"
EMBEDDING_DIMENSIONS: "1536"
RAG_CHUNK_CHARS: "900"
RAG_CHUNK_OVERLAP: "150"
RAG_CANDIDATE_K: "24"
RAG_TOP_K: "6"
RAG_RECENCY_DAYS: "120"
RAG_INGEST_ON_ADVICE: "true"
RAG_TIMEOUT_SECONDS: "15"

MARKET_CAP_BATCH_LIMIT: "400"
SNAPSHOT_BATCH_LIMIT: "200"
CALENDAR_DEFAULT_DAYS: "7"
SCREENER_PAGE_SIZE: "50"

# TEST_DATABASE_URL 은 의도적으로 없다. 테스트 하네스가 drop_all 로 시작하는
# 주소를 운영 컨테이너에 실어 보낼 이유가 없다 (Settings 는 extra="ignore" 다).

# Amplitude 이벤트에 실리는 환경 표식. **운영에서 이 값이 빠지면**
# 기본값 `local` 이 찍혀 실사용자 데이터가 개발 트래픽으로 분류된다.
AMPLITUDE_ENV: "production"

# 구매한 리포트를 다시 볼 수 있는 기간. 프런트의
# NEXT_PUBLIC_SAJU_RETENTION_DAYS 와 **같은 숫자**여야 한다 — 다르면
# 개인정보처리방침에 적힌 기간과 실제 설정이 어긋난다.
SAJU_ORDER_RETENTION_DAYS: "7"
